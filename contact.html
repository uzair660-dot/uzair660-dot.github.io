<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Uzair Aslam | Nursing Portfolio</title>
  <meta name="description" content="Get in touch with Uzair Aslam, nursing student. Send a message directly through the contact form or via email.">
  <link rel="canonical" href="https://uzair660-dot.github.io/contact.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <nav>
      <p class="logo">Uzair</p>
      <button class="hamburger" id="hamburger">☰</button>
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="contact-section">
      <h1>Get in Touch</h1>
      <p>Fill the form below, or email me directly at
        <a href="mailto:uzairaslam660@gmail.com" class="inline-link">uzairaslam660@gmail.com</a>
      </p>

      <!-- id="contact-form" lets script.js find this form to validate it -->
      <form id="contact-form">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Your message..." required></textarea>

        <button type="submit" class="btn">Send Message</button>

        <!-- This empty paragraph is where JS will show success/error messages -->
        <p id="form-status"></p>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Uzair. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
